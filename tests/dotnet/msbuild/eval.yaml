name: msbuild
description: Evaluates task routing and outcomes for the consolidated dotnet/msbuild entry skill
type: capability
defaults:
  timeout: 6m
  runs: 3
stimuli:
  - name: Explain a failure when only the binary log remains
    prompt: |
      The failed build's only remaining artifact is failure.binlog. The original checkout
      is unavailable. Explain the underlying failure, identify the responsible project
      and target, and suggest the smallest correction. Do not recreate or rerun the project.
    environment:
      files:
        - src: fixtures/binlog-only/Failure.proj
          dest: Failure.proj
      commands:
        - dotnet msbuild Failure.proj -nologo -bl:failure.binlog || exit 0
        - node -e "require('fs').unlinkSync('Failure.proj')"
    graders:
      - type: output-contains
        config:
          substring: BLD1001
      - type: output-contains
        config:
          substring: required-settings.json
      - type: file-not-exists
        config:
          path: Failure.proj
      - type: prompt
    rubric:
      - Identified the absent required-settings.json input as the cause of the failed build.
      - Connected the failure to ResolveBuildInputs in Failure.proj rather than inventing a compiler or restore problem.
      - Proposed providing the required input or correcting its intended path without hiding the error.
      - Used the available artifact without recreating the unavailable checkout or claiming to have applied and verified a fix.

  - name: Preserve the requested operation while capturing a new artifact
    prompt: |
      I run `dotnet build Store.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true`
      in PowerShell with the .NET 8 SDK. There is already a build.binlog that I must keep.
      Give me the command to capture a new binary log and how to confirm it was created,
      even if the build fails. Do not run the command or analyze the old log.
    graders:
      - type: output-contains
        config:
          substring: Store.sln
      - type: output-contains
        config:
          substring: --no-restore
      - type: output-contains
        config:
          substring: ContinuousIntegrationBuild=true
      - type: output-matches
        config:
          pattern: '(?i)(-bl:|/bl:|-binarylogger:)'
      - type: prompt
    rubric:
      - Preserved the solution, Release configuration, restore behavior, and CI property.
      - Chose a PowerShell-safe logger argument that does not overwrite the existing build.binlog.
      - Explained how to confirm a new nonempty artifact and distinguished a build failure from failure before logging starts.
      - Kept the response to capture guidance without running a build or starting an unrelated investigation.

  - name: Diagnose two instances sharing the same outputs
    prompt: |
      A parallel solution build sometimes fails with locked PDBs. The log shows Tool.csproj
      twice: one instance has no TargetFramework global property; the other has
      TargetFramework=net10.0. Both write bin\Debug\net10.0 and obj\Debug\net10.0.
      Tool.csproj declares only <TargetFramework>net10.0</TargetFramework>.
      A consumer has <ProjectReference Include="..\Tool\Tool.csproj"
      SetTargetFramework="TargetFramework=net10.0" />. What is the root cause and the
      smallest fix? I need to retain parallel builds. Do not change any files.
    graders:
      - type: output-contains
        config:
          substring: SetTargetFramework
      - type: prompt
    rubric:
      - Explained how differing global properties produce distinct project instances sharing the same output paths.
      - Recommended removing the redundant same-framework metadata while retaining the project reference.
      - Did not generalize the removal to legitimate multi-target selection or intentional different-framework builds.
      - Proposed checking the original parallel scenario instead of treating serialization, retries, or routine cleaning as the permanent fix.

  - name: Correct generation without suppressing real changes
    prompt: |
      Incremental.proj regenerates obj/message.txt on every build, including an immediate
      second build with no changes. Fix it so generation is skipped when up to date, but
      changed message.txt and a deleted generated output are handled correctly. Preserve
      the output location, the GENERATION_EXECUTED trace, and the existing Clean behavior.
    environment:
      files:
        - src: fixtures/incremental
          dest: .
    graders:
      - type: file-contains
        config:
          path: Incremental.proj
          value: GENERATION_EXECUTED
      - type: run-command
        config:
          command: node verify.mjs
          timeout: 90s
      - type: prompt
    rubric:
      - Avoided rerunning generation on an unchanged second build rather than merely hiding its log message.
      - Preserved generation when the source changes or the output is missing.
      - Retained the intended output contents, location, and cleanup behavior without replacing generation with a stale stamp.
      - Reported actual verification outcomes without claiming a broader measured speedup from this small fixture.

  - name: Preserve destination reset semantics when reducing copies
    prompt: |
      On .NET SDK 10.0.100, an existing None item has CopyToOutputDirectory="Always".
      The file is large. Another local tool sometimes edits the output copy and gives it
      a newer timestamp than the source. The next build must restore the source version,
      but identical copies should not be rewritten. What metadata change is appropriate,
      and what behavior should I verify? This is advice only.
    graders:
      - type: output-contains
        config:
          substring: IfDifferent
      - type: prompt
    rubric:
      - Selected a supported copy mode that skips unchanged copies but can reset a newer differing destination.
      - Explained why PreserveNewest alone does not preserve the stated destination-reset contract.
      - Did not claim a cryptographic or byte-for-byte content comparison where the copy mechanism uses file metadata.
      - Included unchanged, changed-source, changed-destination, and missing-destination checks, without applying an unrelated build rewrite.

  - name: Distinguish evaluation cost from compiler cost
    prompt: |
      My trace of a successful no-change build shows 6.8 seconds before targets execute:
      5.9 seconds is expanding a recursive source glob across the repository, including
      generated and package-cache trees. All target execution together is 0.6 seconds,
      and CoreCompile is skipped. Should I increase -m or disable analyzers first?
      Explain the first focused change to investigate and how to compare it. Do not edit files.
    graders:
      - type: prompt
    rubric:
      - Identified item/glob evaluation as the measured dominant cost rather than compilation or analyzer execution.
      - Recommended inspecting and narrowing the actual glob or excluding irrelevant trees while preserving required inputs.
      - Did not recommend changing parallelism, disabling analyzers, or removing SDK imports as a substitute for addressing the evidence.
      - Required comparable before/after evaluation and total build measurements and checks that required files still participate.

  - name: Reject an unsupported performance improvement claim
    prompt: |
      Same machine, command, SDK, configuration, and successful no-change scenario:
      before = [10.0, 9.8, 10.2] seconds; after = [9.9, 10.3, 9.7] seconds.
      Can I say this change made builds 8% faster? Explain what these measurements
      support and the next evidence needed. Do not run new experiments.
    graders:
      - type: prompt
    rubric:
      - Rejected the 8 percent improvement claim using the supplied measurements.
      - Recognized that the small difference is within the observed spread and does not establish a reliable gain.
      - Kept the comparison tied to the same scenario instead of combining clean, incremental, and restore timings.
      - Suggested additional controlled repetitions or bottleneck evidence without inventing measurements or claiming experiments were run.

  - name: Preserve legacy assembly and framework contracts
    prompt: |
      Give a focused SDK-style conversion plan for a supported legacy C# library that
      targets .NET Framework v4.7.2. AssemblyInfo.cs contains AssemblyVersion("2.1.0.0"),
      AssemblyFileVersion("2.1.7.0"), ComVisible(false), Guid("7b34594f-fbb3-49ad-8d18-3ee62200ad21"),
      and InternalsVisibleTo("Library.Tests"). app.config contains binding redirects.
      Keep the framework, public assembly identity, package versions, and runtime behavior.
      Do not install a converter or make changes.
    graders:
      - type: output-contains
        config:
          substring: net472
      - type: prompt
    rubric:
      - Preserved the existing framework as net472 rather than treating project-format conversion as a framework upgrade.
      - Preserved the distinct assembly and file versions and non-generated custom attributes.
      - Offered a consistent strategy for keeping AssemblyInfo.cs or moving only SDK-generated attributes without duplication.
      - Did not delete the runtime configuration or binding redirects wholesale, and identified the affected contracts to verify.
      - Did not introduce unrequested package, language-feature, or SDK changes or claim a nonexistent built-in migration command.

  - name: Leave a valid packed-layout forwarder intact
    prompt: |
      Review Adapter/buildTransitive/common/Fixture.Adapter.props for a missing-import
      defect and make a change only if needed. The shared nuspec is one directory above
      Adapter.csproj. It creates the per-framework layout at pack time. A net10.0
      consumer may select this package's net8.0 assets. Source has no build/net8.0 folder.
      Should the import be guarded or rewritten to use the consumer's TargetFramework?
    environment:
      files:
        - src: fixtures/packed-import
          dest: .
    graders:
      - type: file-not-contains
        config:
          path: Adapter/buildTransitive/common/Fixture.Adapter.props
          value: Condition=
      - type: file-not-contains
        config:
          path: Adapter/buildTransitive/common/Fixture.Adapter.props
          value: $(TargetFramework)
      - type: file-contains
        config:
          path: Adapter/buildTransitive/common/Fixture.Adapter.props
          value: GetDirectoryName
      - type: prompt
    rubric:
      - Resolved the import against the shared nuspec's packed layout rather than reporting the absent source directory as a defect.
      - Recognized that the matched asset folder may differ from the consuming project's framework.
      - Preserved the valid required import without adding a guard that hides a broken package contract.
      - Left the already-correct files unchanged and explained why no rewrite is needed.

  - name: Extend a hook without dropping its existing extension
    prompt: |
      Build.proj used to load First.targets through a hook. After adding Second.targets,
      the original hook no longer runs and the build fails. Fix the composition so both
      hooks run in that order. Host.targets represents an SDK-owned import contract:
      do not change it. Preserve the behavior of both existing hook files.
    environment:
      files:
        - src: fixtures/hook-composition
          dest: .
    graders:
      - type: run-command
        config:
          command: dotnet msbuild Build.proj -t:Build -nologo -v:minimal
          stdout_matches: 'HOOKS=first;second;'
          timeout: 60s
      - type: file-contains
        config:
          path: Host.targets
          value: Exists('$(CustomBeforeExampleTargets)')
      - type: prompt
    rubric:
      - Identified the second property assignment replacing the existing hook value.
      - Composed both original hooks through a supported import list or aggregation file, preserving their order and behavior.
      - Did not overwrite or discard a prior hook or modify the SDK-owned Host.targets contract.
      - Verified the original build with both hooks actually participating.

  - name: Fix an early property without moving valid items
    prompt: |
      Build.proj fails because NET10_FEATURE is absent from DefineConstants even though
      TargetFramework is net10.0. The FeatureMarker item in the same early props file
      appears correctly. Fix the broken property assignment while preserving the working
      item, BASE constant, and file organization. Do not migrate packages or project format.
    environment:
      files:
        - src: fixtures/early-property
          dest: .
    graders:
      - type: run-command
        config:
          command: dotnet msbuild Build.proj -t:Build -nologo -v:minimal
          stdout_matches: 'CONSTANTS=BASE;NET10_FEATURE ITEMS=valid-item'
          timeout: 60s
      - type: file-contains
        config:
          path: Directory.Build.props
          value: FeatureMarker Include="valid-item"
      - type: prompt
    rubric:
      - Moved or otherwise correctly timed the framework-dependent property assignment after TargetFramework is available.
      - Distinguished property evaluation from later item evaluation instead of declaring both conditions invalid.
      - Retained the BASE constant and the existing working item in the early props file.
      - Verified the intended property and item values without unrelated migrations.

  - name: Recognize valid ordered and sequential item declarations
    prompt: |
      Review these two independent, already-building snippets without making changes.
      An SDK-style F# project explicitly lists Domain.fsi, Domain.fs, Services.fs,
      and Program.fs in that order; Program is the entry point and Services uses Domain.
      Separately, an MSBuild ItemGroup has
      <Extra Include="external.dat" /><Extra Update="external.dat" Visible="false" />.
      Must I delete the F# list or split the Include and Update into different groups
      to make these correct?
    graders:
      - type: prompt
    rubric:
      - Preserved F# dependency order, signature/implementation adjacency, and the entry point's final position.
      - Recognized that an Update after the corresponding Include in the same group can correctly change metadata.
      - Did not manufacture a correctness defect or recommend an unnecessary rewrite of either valid pattern.

  - name: Keep runtime profiling separate from build performance
    prompt: |
      Our ASP.NET process uses 100% CPU after startup. Builds are fast and succeed.
      Give a short plan for profiling the live application's CPU usage. Do not collect
      anything or change the application yet.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Recognized application execution rather than building as the problem.
      - Did not apply a binary-log, build-timing, project-modernization, or MSBuild optimization workflow.
      - Directed the investigation toward appropriate runtime profiling without installing or collecting anything.

  - name: Keep native build systems outside this workflow
    prompt: |
      My Linux C++ project builds with CMake and Ninja, not MSBuild or dotnet.
      GCC reports an undefined reference at link time. Explain what to inspect first;
      do not run commands or edit files.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Recognized a native CMake/Ninja linker investigation rather than an MSBuild problem.
      - Did not apply .NET binary-log capture, project-file conversion, or SDK installation guidance.
      - Suggested relevant symbol, library, and linker-input investigation without inventing a .NET prerequisite.

  - name: Keep SDK installation as a separate task
    prompt: |
      I have a .NET 10 host and want a project-local .NET 11 preview SDK for experimentation,
      without changing the system installation. There is no build failure to investigate.
      Explain the setup and global.json configuration only; do not download anything.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Recognized project-local SDK setup as the requested operation.
      - Did not apply build-failure diagnosis, binary-log capture, performance tuning, or project modernization.
      - Kept the answer about isolated SDK configuration without downloading tools or changing the system installation.

  - name: Keep C# symbol refactoring separate from build-file cleanup
    prompt: |
      I want to rename the C# class CustomerRecord to CustomerSnapshot and update its
      references without changing behavior. No project or build-file changes are needed.
      Explain a safe approach; do not edit the repository.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Recognized a C# symbol refactoring rather than project/build-file modernization.
      - Did not apply a binary-log investigation or recommend changing MSBuild properties and imports.
      - Recommended reference-aware refactoring and proportionate behavior checks without making edits.
